[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "home-movie-poster"
version = "0.1.0"
description = "Self-hosted portrait movie poster display for Kaleidescape"
readme = "README.md"
requires-python = "==3.12.8"
dependencies = [
    "beautifulsoup4==4.14.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "django==5.2.18",
    "django-ninja==1.7.1",
    "httpx==0.28.1",
    "lxml==6.0.2",
    "pillow==11.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pykaleidescape==1.2.0",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "uvicorn[standard]==0.54.0",
    "watchfiles==1.3.0",
]

[project.scripts]
poster = "apps.cli.main:main"

[dependency-groups]
dev = [
    "django-stubs==5.2.9",
    "import-linter==2.15",
    "playwright==1.58.0",
    "pyright==1.1.414",
    "pytest==8.3.5",
    "pytest-asyncio==1.3.0",
    "pytest-django==4.14.0",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pyright]
include = ["apps"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not postgres and not browser'"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "apps.server.config.settings"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: integration tests requiring PostgreSQL and Redis",
    "browser: headless Chromium tests",
]
