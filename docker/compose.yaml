name: home-movie-poster

x-logging: &logging
  driver: local
  options: {max-size: "5m", max-file: "3"}

x-app-env: &app-env
  DATABASE_HOST: pgbouncer
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-home_movie_poster}
  POSTGRES_USER: ${POSTGRES_USER:-movie_poster}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie-poster-local-development}
  POSTER_REDIS_URL: redis://redis:6379/0
  POSTER_MEDIA_ROOT: /data/media
  POSTER_TIME_ZONE: ${POSTER_TIME_ZONE:-America/Chicago}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deployment}
  TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
  LOG_JSON: ${LOG_JSON:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  build: {context: .., dockerfile: docker/Dockerfile.web, target: development}
  init: true
  logging: *logging
  environment: *app-env
  volumes: ["../:/workspace", "media:/data/media"]

services:
  postgres:
    image: postgres:18.6-bookworm
    logging: *logging
    environment: &postgres-env
      POSTGRES_DB: ${POSTGRES_DB:-home_movie_poster}
      POSTGRES_USER: ${POSTGRES_USER:-movie_poster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie-poster-local-development}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    logging: *logging
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    environment: *postgres-env
    entrypoint: ["sh", "/workspace/docker/pgbouncer.sh"]
    volumes: ["../:/workspace:ro"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.3-alpine
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  database-init:
    image: postgres:18.6-bookworm
    logging: *logging
    depends_on: {pgbouncer: {condition: service_healthy}}
    environment: *postgres-env
    command: ["sh", "-ec", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h pgbouncer -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1'"]
  migrate:
    <<: *app
    depends_on:
      database-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: ["python", "-m", "apps.cli.main", "manage", "migrate", "--noinput"]
  web:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: ["python", "-m", "apps.cli.main", "web", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  client:
    build: {context: .., dockerfile: docker/Dockerfile.client}
    init: true
    logging: *logging
    environment:
      VITE_API_TARGET: http://web:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-0}
    volumes: ["../apps/client:/workspace/apps/client", "/workspace/apps/client/node_modules"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  proxy:
    image: nginx:1.28.0-alpine
    init: true
    logging: *logging
    user: nginx
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["${WEB_PORT:-8000}:8080"]
    depends_on:
      web: {condition: service_healthy}
      client: {condition: service_healthy}
  monitor:
    <<: *app
    network_mode: host
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *app-env
      DATABASE_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
      POSTER_REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}/0
    command: ["python", "-m", "apps.cli.main", "monitor"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media:
