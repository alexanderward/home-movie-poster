name: home-frame

x-logging: &logging
  driver: local
  options: {max-size: "5m", max-file: "3"}

x-app-env: &app-env
  POSTER_DATABASE_PATH: /data/poster.sqlite3
  POSTER_MEDIA_ROOT: /data/media
  POSTER_TIME_ZONE: ${POSTER_TIME_ZONE:-America/Chicago}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deployment}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
  KALEIDESCAPE_MANUAL_HOST: ${KALEIDESCAPE_MANUAL_HOST:-}
  LOG_JSON: ${LOG_JSON:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  image: home-frame:latest
  build: {context: .., dockerfile: docker/Dockerfile.web, target: web}
  init: true
  logging: *logging
  environment: *app-env
  volumes: ["poster-data:/data"]
  restart: unless-stopped

services:
  web:
    <<: *app
    command:
      - sh
      - -c
      - >-
        python -m apps.cli.main manage migrate --noinput &&
        exec python -m apps.cli.main web --host 0.0.0.0 --port 8000 --no-reload
    ports: ["${WEB_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  monitor:
    <<: *app
    network_mode: host
    depends_on:
      web: {condition: service_healthy}
    command: ["python", "-m", "apps.cli.main", "monitor"]

volumes:
  poster-data:
    # Keeps the volume created before the rename to Frame, so existing data carries over.
    name: home-movie-poster_poster-data
