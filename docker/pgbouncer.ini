[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /tmp/pgbouncer-users.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
log_connections = 1
log_disconnections = 1
