services:
  postgres:
    restart: unless-stopped
  pgbouncer:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  web:
    build: {context: .., dockerfile: docker/Dockerfile.web, target: web}
    restart: unless-stopped
    command: ["python", "-m", "apps.cli.main", "web", "--host", "0.0.0.0", "--port", "8000", "--no-reload"]
    volumes: !override ["media:/data/media"]
    environment:
      DJANGO_DEBUG: "0"
  monitor:
    build: {context: .., dockerfile: docker/Dockerfile.web, target: web}
    restart: unless-stopped
    volumes: !override ["media:/data/media"]
    environment:
      DJANGO_DEBUG: "0"
  proxy:
    image: home-movie-poster-proxy:latest
    build: {context: .., dockerfile: docker/Dockerfile.proxy}
    restart: unless-stopped
    volumes: !override []
    ports: !override ["${WEB_PORT:-8000}:8080"]
    depends_on: !override
      web: {condition: service_healthy}
  client:
    profiles: [development-only]
