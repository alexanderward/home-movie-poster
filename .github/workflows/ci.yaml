name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: home_movie_poster
          POSTGRES_USER: movie_poster
          POSTGRES_PASSWORD: movie-poster-ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movie_poster -d home_movie_poster"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_DB: home_movie_poster
      POSTGRES_USER: movie_poster
      POSTGRES_PASSWORD: movie-poster-ci
      POSTGRES_PORT: 5433
      POSTER_REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.6.6
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm install --global pnpm@12.11.2
      - run: uv sync --locked
      - run: pnpm --dir apps/client install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pyright
      - run: pnpm --dir apps/client lint
      - run: uv run python scripts/commands.py check
      - run: pnpm --dir apps/client build
      - run: uv run pytest
      - run: pnpm --dir apps/client test
      - run: uv run python -m apps.server.manage migrate --noinput
      - run: uv run pytest -m postgres
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
      - run: docker compose --env-file .env.example -f docker/compose.yaml config --quiet
      - run: docker compose --env-file .env.example -f docker/compose.yaml -f docker/compose.production.yaml config --quiet
      - run: docker build --platform linux/${{ matrix.arch }} -f docker/Dockerfile.web --target web .
      - run: docker build --platform linux/${{ matrix.arch }} -f docker/Dockerfile.proxy .
