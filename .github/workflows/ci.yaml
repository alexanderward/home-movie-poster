name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.6.6
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm install --global pnpm@12.11.2
      - run: uv sync --locked
      - run: pnpm --dir apps/client install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pyright
      - run: pnpm --dir apps/client lint
      - run: uv run python scripts/commands.py check
      - run: pnpm --dir apps/client build
      - run: uv run pytest
      - run: pnpm --dir apps/client test
      - run: uv run python -m apps.server.manage migrate --noinput
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
      - run: docker compose --env-file .env.example -f docker/compose.yaml config --quiet
      - run: docker build --platform linux/${{ matrix.arch }} -f docker/Dockerfile.web --target web .
